<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Accident | RapidRescue</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 22px;
background:#111827;
flex-wrap:wrap;
gap:10px;
}

.logo{
font-size:30px;
font-weight:bold;
color:#ef4444;
}

button{
padding:10px 16px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
font-weight:bold;
}

.wrap{
display:flex;
justify-content:center;
padding:22px;
}

.box{
width:100%;
max-width:780px;
background:#111827;
padding:28px;
border-radius:20px;
}

.title{
font-size:32px;
font-weight:bold;
margin-bottom:10px;
}

.sub{
color:#94a3b8;
margin-bottom:22px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

label{
display:block;
margin-bottom:8px;
font-size:14px;
font-weight:bold;
color:#cbd5e1;
}

input,
select,
textarea{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#1e293b;
color:white;
margin-bottom:16px;
font-size:15px;
}

textarea{
height:140px;
resize:none;
}

.preview{
width:100%;
max-height:250px;
object-fit:cover;
border-radius:14px;
display:none;
margin-bottom:16px;
}

.loc{
background:#1e293b;
padding:14px;
border-radius:12px;
margin-bottom:16px;
font-size:14px;
}

.submit-btn{
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:#ef4444;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.submit-btn:hover{
background:#dc2626;
}

@media(max-width:768px){

.row{
grid-template-columns:1fr;
}

.title{
font-size:26px;
}

.wrap{
padding:16px;
}

.box{
padding:22px;
}

.logo{
font-size:24px;
}

}
</style>
</head>

<body>

<nav>

<div class="logo">RapidRescue</div>

<button onclick="location.href='dashboard.html'">
Dashboard
</button>

</nav>

<div class="wrap">

<div class="box">

<div class="title">🚨 Smart Accident Report</div>

<div class="sub">
Upload photo, detect location and request emergency help instantly.
</div>

<div class="row">

<div>
<label for="name">Full Name</label>
<input type="text" id="name" placeholder="Enter name">
</div>

<div>
<label for="contact">Contact Number</label>
<input type="text" id="contact" placeholder="Enter mobile number">
</div>

</div>

<div class="row">

<div>
<label for="type">Accident Type</label>
<select id="type">
<option value="">Select Type</option>
<option>Minor</option>
<option>Major</option>
<option>Critical</option>
</select>
</div>

<div>
<label for="location">Location</label>
<input type="text" id="location" placeholder="Auto detecting...">
</div>

</div>

<label for="photo">Upload Accident Photo</label>
<input type="file" id="photo" accept="image/*">

<img id="preview" class="preview">

<div class="loc" id="liveLoc">
📍 Detecting your live location...
</div>

<label for="description">Description</label>
<textarea id="description" placeholder="Explain what happened"></textarea>

<button class="submit-btn" onclick="reportAccident()">
🚑 Submit Emergency Report
</button>

</div>

</div>

<script>
/* IMAGE PREVIEW */
document.getElementById("photo").addEventListener("change",function(){

const file = this.files[0];
if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

const img = document.getElementById("preview");
img.src = e.target.result;
img.style.display = "block";

};

reader.readAsDataURL(file);

});

/* LIVE LOCATION */
if(navigator.geolocation){

navigator.geolocation.getCurrentPosition((pos)=>{

const lat = pos.coords.latitude.toFixed(5);
const lng = pos.coords.longitude.toFixed(5);

document.getElementById("location").value =
lat + ", " + lng;

document.getElementById("liveLoc").innerHTML =
"📍 Live Location Captured Successfully";

},()=>{

document.getElementById("liveLoc").innerHTML =
"Location permission denied";

});

}
</script>

<script src="js/app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | RapidRescue</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:
linear-gradient(135deg,#020617,#0f172a,#1e293b);
color:white;
}

.box{
width:100%;
max-width:430px;
background:#111827;
padding:34px;
border-radius:22px;
box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

.logo{
text-align:center;
font-size:34px;
font-weight:bold;
color:#ef4444;
margin-bottom:10px;
}

.title{
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:8px;
}

.sub{
text-align:center;
color:#94a3b8;
margin-bottom:24px;
font-size:14px;
line-height:1.6;
}

label{
display:block;
margin-bottom:8px;
font-size:14px;
font-weight:bold;
color:#cbd5e1;
}

input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#1e293b;
color:white;
margin-bottom:16px;
font-size:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#ef4444;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#dc2626;
}

.extra{
text-align:center;
margin-top:18px;
font-size:14px;
color:#cbd5e1;
}

.extra a{
color:#38bdf8;
text-decoration:none;
font-weight:bold;
}

@media(max-width:500px){

.box{
padding:24px;
}

.logo{
font-size:28px;
}

.title{
font-size:24px;
}

}
</style>
</head>

<body>

<div class="box">

<div class="logo">RapidRescue</div>

<div class="title">Welcome Back</div>

<div class="sub">
Smart highway emergency response system
</div>

<label>Email</label>
<input type="email" id="email" placeholder="Enter email">

<label>Password</label>
<input type="password" id="password" placeholder="Enter password">

<button onclick="loginUser()">
Login Securely
</button>

<div class="extra">
New user?
<a href="signup.html">Create Account</a>
</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
